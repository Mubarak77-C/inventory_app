name: CI Build & Smoke Test

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify app.js syntax
        run: node --check app.js

      - name: Build Docker image
        run: docker build -t inventory-app-test .

      - name: Start PostgreSQL & App for Smoke Test
        run: |
          docker network create test-net
          docker run -d --name test-postgres --network test-net \
            -e POSTGRES_USER=my_user \
            -e POSTGRES_PASSWORD=test_ci_password \
            -e POSTGRES_DB=inventory_db \
            postgres:15-alpine
          sleep 5
          docker exec -i test-postgres psql -U my_user -d inventory_db < db/populatedb.sql
          docker run -d --name test-app --network test-net -p 3000:3000 \
            -e DATABASE_URL=postgresql://my_user:test_ci_password@test-postgres:5432/inventory_db \
            -e GEMINI_API_KEY=test_ci_key \
            -e PORT=3000 \
            inventory-app-test
          sleep 5

      - name: Run HTTP Smoke Test on /items
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/items)
          echo "HTTP Status returned: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            docker logs test-app
            exit 1
          fi
