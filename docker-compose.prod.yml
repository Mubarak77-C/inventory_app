services:
  app:
    build: .
    container_name: inventory_node_prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://my_user:${DB_PASSWORD}@postgres:5432/inventory_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    command: npm start
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  postgres:
    image: pgvector/pgvector:pg15
    container_name: inventory_postgres_prod
    environment:
      - POSTGRES_USER=my_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=inventory_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_user -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  pgdata:
