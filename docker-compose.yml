services:
  app:
    build: .
    container_name: inventory_node_app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://my_user:${DB_PASSWORD}@postgres:5432/inventory_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SESSION_SECRET=super_secret_inventory_session_key_change_in_prod
      - NODE_ENV=${NODE_ENV:-development}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      # - SESSION_SECRET=${SESSION_SECRET}    #when using at production level
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg15
    container_name: inventory_postgres
    environment:
      - POSTGRES_USER=my_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=inventory_db

    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_user -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
